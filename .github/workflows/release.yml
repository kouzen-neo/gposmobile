name: gPOS Mobile Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0). Leave empty if triggered by tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve Release Tag and Version
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            echo "Manual release requires a version input (e.g. 0.1.0)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: aarch64
            abi: arm64-v8a
            triple: aarch64-linux-android
          - arch: armv7
            abi: armeabi-v7a
            triple: armv7-linux-androideabi
          - arch: x86_64
            abi: x86_64
            triple: x86_64-linux-android
          - arch: i686
            abi: x86
            triple: i686-linux-android
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android NDK
        id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          link-to-sdk: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}

      - name: Restore Keystore from Secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > src-tauri/gpos-release.jks
          fi

      - name: Build Android APK (${{ matrix.target.abi }})
        env:
          NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
          ANDROID_HOME: ${{ env.ANDROID_HOME || '/usr/local/lib/android/sdk' }}
        run: |
          echo "NDK path: $NDK_HOME"
          pnpm tauri android build --target ${{ matrix.target.arch }} --apk --split-per-abi

      - name: Locate and Stage Built APK
        run: |
          mkdir -p staged-apk
          APK_FILE=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi
          cp "$APK_FILE" "staged-apk/gPOS-${{ matrix.target.abi }}-v${{ needs.prepare.outputs.version }}.apk"

      - name: Upload APK Artifact (${{ matrix.target.abi }})
        uses: actions/upload-artifact@v5
        with:
          name: gpos-apk-${{ matrix.target.abi }}
          path: staged-apk/*.apk
          retention-days: 7

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download All Built APKs
        uses: actions/download-artifact@v5
        with:
          pattern: gpos-apk-*
          path: apks
          merge-multiple: true

      - name: Compute Checksums
        run: |
          cd apks
          ls -la
          sha256sum gPOS-*.apk | tee sha256sums.txt

      - name: Compose Release Body from CHANGELOG.md
        run: |
          V="${{ needs.prepare.outputs.version }}"
          awk -v v="v$V" 'index($0, "## [" v "]") == 1 { flag=1; next } flag && /^## \[/ { exit } flag { print }' CHANGELOG.md > /tmp/changelog-section.md
          
          {
            echo "# gPOS Mobile v$V"
            echo ""
            if [ -s /tmp/changelog-section.md ]; then
              cat /tmp/changelog-section.md
              echo ""
            fi
            echo "---"
            echo ""
            echo "## Berkas APK"
            echo ""
            while read -r hash file; do
              size=$(du -h "apks/$file" | cut -f1)
              echo "- **\`$file\`** (${size})"
              echo "  SHA256: \`$hash\`"
            done < apks/sha256sums.txt
            echo ""
            echo "Pilih **\`gPOS-arm64-v8a-v${V}.apk\`** untuk sebagian besar ponsel Android modern."
            echo ""
            echo "---"
            echo "*Changelog lengkap: [CHANGELOG.md](https://github.com/kouzen-neo/gposmobile/blob/main/CHANGELOG.md)*"
          } > /tmp/release-body.md
          cat /tmp/release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: gPOS Mobile ${{ needs.prepare.outputs.tag }}
          body_path: /tmp/release-body.md
          files: |
            apks/gPOS-*.apk
            apks/sha256sums.txt
          token: ${{ secrets.GITHUB_TOKEN }}
